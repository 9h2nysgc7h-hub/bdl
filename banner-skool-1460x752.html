<title>Banner Skool BDL</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Archivo+Black&display=swap');

*{box-sizing:border-box;margin:0;padding:0}
html,body{
  width:1460px;height:752px;overflow:hidden;
  background:#0E1A24;
}
.canvas{
  position:relative;width:1460px;height:752px;
  background:
    radial-gradient(ellipse 900px 700px at 50% 40%, #1B2E42 0%, #101E2B 55%, #070D13 100%);
  overflow:hidden;
}

/* light rays */
.ray{
  position:absolute;top:-120px;left:730px;
  width:10px;height:1000px;
  background:linear-gradient(to bottom, rgba(228,199,102,.16) 0%, rgba(228,199,102,0) 78%);
  transform-origin:top center;
  filter:blur(3px);
  mix-blend-mode:screen;
}
.r1{transform:rotate(-34deg);width:6px}
.r2{transform:rotate(-21deg);width:14px}
.r3{transform:rotate(-8deg);width:8px}
.r4{transform:rotate(6deg);width:16px}
.r5{transform:rotate(19deg);width:7px}
.r6{transform:rotate(32deg);width:12px}

/* vignette */
.vignette{
  position:absolute;inset:0;
  background:radial-gradient(ellipse 900px 600px at 50% 42%, transparent 45%, rgba(0,0,0,.55) 100%);
}

.stage{
  position:relative;z-index:2;
  width:100%;height:100%;
  display:flex;align-items:center;justify-content:center;
}

.crest-wrap{
  filter:drop-shadow(0 18px 40px rgba(0,0,0,.55)) drop-shadow(0 0 60px rgba(201,162,39,.18));
}

.wordmark{
  position:absolute;bottom:66px;left:0;right:0;
  text-align:center;z-index:3;
}
.wordmark .full{
  font-family:'Archivo Black',Arial,sans-serif;
  font-size:15px;letter-spacing:.42em;text-transform:uppercase;
  color:#E4C766;margin:0 0 6px;
  text-shadow:0 2px 6px rgba(0,0,0,.6);
}
.wordmark .by{
  font-family:Arial,sans-serif;font-size:11px;letter-spacing:.2em;text-transform:uppercase;
  color:#7C8A98;
}
</style>

<div class="canvas">
  <div class="ray r1"></div>
  <div class="ray r2"></div>
  <div class="ray r3"></div>
  <div class="ray r4"></div>
  <div class="ray r5"></div>
  <div class="ray r6"></div>
  <div class="vignette"></div>

  <div class="stage">
    <div class="crest-wrap">
      <svg width="360" height="414" viewBox="0 0 200 230" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <linearGradient id="goldBody" x1="0.15" y1="0" x2="0.85" y2="1">
            <stop offset="0%" stop-color="#F4E3A1"/>
            <stop offset="18%" stop-color="#E4C766"/>
            <stop offset="45%" stop-color="#C9A227"/>
            <stop offset="72%" stop-color="#9C7A1E"/>
            <stop offset="100%" stop-color="#6E5414"/>
          </linearGradient>
          <linearGradient id="goldEdge" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0%" stop-color="#FBEFC4"/>
            <stop offset="50%" stop-color="#C9A227"/>
            <stop offset="100%" stop-color="#7A5E17"/>
          </linearGradient>
          <linearGradient id="starGrad" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="#FBEFC4"/>
            <stop offset="60%" stop-color="#D9A441"/>
            <stop offset="100%" stop-color="#8B6A1B"/>
          </linearGradient>
          <radialGradient id="sheen" cx="30%" cy="20%" r="70%">
            <stop offset="0%" stop-color="#ffffff" stop-opacity="0.55"/>
            <stop offset="35%" stop-color="#ffffff" stop-opacity="0.08"/>
            <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
          </radialGradient>
        </defs>

        <path d="M100,4 L104,15 L116,15 L106,22 L110,33 L100,26 L90,33 L94,22 L84,15 L96,15 Z" fill="url(#starGrad)" stroke="#FBEFC4" stroke-width="0.5"/>

        <path d="M100,210 Q40,150 15,75 L25,46 L25,28 L55,28 L55,46 L85,46 L85,28 L115,28 L115,46 L145,46 L145,28 L175,28 L175,46 L185,75 Q160,150 100,210 Z"
              fill="url(#goldBody)" stroke="url(#goldEdge)" stroke-width="4" stroke-linejoin="round"/>

        <path d="M100,196 Q52,144 32,80 L40,56 L40,40 L160,40 L160,56 L168,80 Q148,144 100,196 Z"
              fill="none" stroke="#FBEFC4" stroke-width="1.3" opacity="0.75"/>

        <path d="M100,210 Q40,150 15,75 L25,46 L25,28 L55,28 L55,46 L85,46 L85,28 L115,28 L115,46 L145,46 L145,28 L175,28 L175,46 L185,75 Q160,150 100,210 Z"
              fill="url(#sheen)"/>

        <text x="100" y="128" text-anchor="middle" font-family="Archivo Black, Arial, sans-serif" font-size="48" fill="#12202E">BDL</text>
        <text x="100" y="127" text-anchor="middle" font-family="Archivo Black, Arial, sans-serif" font-size="48" fill="#1E3348" opacity="0.4">BDL</text>

        <line x1="62" y1="145" x2="138" y2="145" stroke="#FBEFC4" stroke-width="1.5" opacity="0.75"/>
      </svg>
    </div>
  </div>

  <div class="wordmark">
    <p class="full">Bastión De Líderes</p>
    <p class="by">by Nave</p>
  </div>
</div>
